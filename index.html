<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ravalliq Chempionati</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ucl-dark: #04091e;
            --ucl-card: rgba(14, 25, 59, 0.7);
            --ucl-cyan: #00f2fe;
            --ucl-blue: #0066ff;
            --ucl-border: rgba(0, 242, 254, 0.18);
            --text-main: #ffffff;
            --text-muted: #8ea3bf;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--ucl-dark);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(0, 102, 255, 0.45) 0%, transparent 65%),
                radial-gradient(circle at 100% 100%, rgba(0, 242, 254, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 14px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 12px 0 16px;
        }

        .header .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--ucl-cyan);
            border: 1px solid var(--ucl-border);
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 242, 254, 0.08);
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 21px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 40%, var(--ucl-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Nav Tabs */
        .main-tabs {
            display: flex;
            background: rgba(10, 20, 50, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .main-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 9px 0;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .main-tab-btn.active {
            background: linear-gradient(135deg, var(--ucl-blue), #0044bb);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
        }

        /* Group Selector */
        .groups-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .group-btn {
            flex: 1;
            background: rgba(14, 25, 59, 0.6);
            border: 1px solid var(--ucl-border);
            color: var(--text-muted);
            padding: 7px 0;
            font-size: 11px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .group-btn.active {
            background: var(--ucl-cyan);
            color: #04091e;
            font-weight: 800;
            border-color: var(--ucl-cyan);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }

        /* Card Container */
        .card {
            background: var(--ucl-card);
            border: 1px solid var(--ucl-border);
            border-radius: 14px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 12px;
        }

        thead {
            background: rgba(4, 9, 30, 0.6);
            border-bottom: 1px solid var(--ucl-border);
        }

        th {
            padding: 10px 4px;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 10px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .col-pos {
            width: 28px;
            font-weight: 800;
            color: var(--text-muted);
        }

        .top-pos {
            color: var(--ucl-cyan);
        }

        .col-team {
            text-align: left;
            font-weight: 700;
            color: #fff;
            padding-left: 6px !important;
        }

        .col-pts {
            font-weight: 800;
            color: var(--ucl-cyan);
            font-size: 13px;
        }

        /* Scorers */
        .scorer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scorer-item:last-child {
            border-bottom: none;
        }

        .scorer-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .scorer-rank {
            font-size: 13px;
            font-weight: 800;
            width: 20px;
            color: var(--text-muted);
        }

        .rank-gold {
            color: var(--ucl-cyan);
        }

        .scorer-name {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .scorer-team {
            font-size: 11px;
            color: var(--text-muted);
        }

        .scorer-goals {
            font-size: 12px;
            font-weight: 800;
            background: rgba(0, 242, 254, 0.1);
            color: var(--ucl-cyan);
            border: 1px solid var(--ucl-border);
            padding: 4px 10px;
            border-radius: 8px;
        }

        /* Matches */
        .date-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--ucl-cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 14px 0 8px 4px;
        }

        .match-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .match-row:last-child {
            border-bottom: none;
        }

        .match-t {
            flex: 1;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .match-t.right {
            text-align: right;
        }

        .match-time {
            padding: 3px 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--ucl-border);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">JIZZAX</div>
        <h1>Ravalliq Chempionati</h1>
        <p>Jonli turnir jadvali va o'yinlar taqvimi</p>
    </div>

    <!-- Asosiy tablar -->
    <div class="main-tabs">
        <button id="tab-standings" class="main-tab-btn active" onclick="switchMainTab('standings')">Jadval</button>
        <button id="tab-scorers" class="main-tab-btn" onclick="switchMainTab('scorers')">To'purarlar</button>
        <button id="tab-matches" class="main-tab-btn" onclick="switchMainTab('matches')">O'yinlar</button>
    </div>

    <!-- 1. Jadvallar bo'limi -->
    <div id="section-standings">
        <div class="groups-bar">
            <button id="btn-group-A" class="group-btn active" onclick="renderGroup('A')">Guruh A</button>
            <button id="btn-group-B" class="group-btn" onclick="renderGroup('B')">Guruh B</button>
            <button id="btn-group-C" class="group-btn" onclick="renderGroup('C')">Guruh C</button>
            <button id="btn-group-D" class="group-btn" onclick="renderGroup('D')">Guruh D</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th class="col-pos">#</th>
                        <th style="text-align: left; padding-left: 8px;">Jamoa</th>
                        <th>O'</th>
                        <th>+/-</th>
                        <th class="col-pts">Och</th>
                    </tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </div>
    </div>

    <!-- 2. To'purarlar bo'limi -->
    <div id="section-scorers" class="hidden">
        <div class="card" id="scorers-body"></div>
    </div>

    <!-- 3. O'yinlar taqvimi bo'limi -->
    <div id="section-matches" class="hidden">
        <div id="matches-body"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const groupsData = {
            "A": [
                { name: "Mahalla", p: 4, diff: "+9", pts: 9 },
                { name: "2006", p: 4, diff: "0", pts: 9 },
                { name: "1993", p: 4, diff: "+10", pts: 7 },
                { name: "2003", p: 3, diff: "+10", pts: 6 },
                { name: "2009", p: 5, diff: "-10", pts: 6 },
                { name: "2004", p: 5, diff: "-6", pts: 5 },
                { name: "2009-23", p: 5, diff: "-13", pts: 1 }
            ],
            "B": [
                { name: "1996-23", p: 4, diff: "+5", pts: 9 },
                { name: "2002-23", p: 5, diff: "+3", pts: 7 },
                { name: "1986", p: 4, diff: "-2", pts: 6 },
                { name: "2005", p: 4, diff: "-10", pts: 6 },
                { name: "2003-12", p: 4, diff: "+5", pts: 4 },
                { name: "1991-23", p: 3, diff: "0", pts: 4 },
                { name: "2002", p: 4, diff: "-1", pts: 4 }
            ],
            "C": [
                { name: "1988", p: 5, diff: "+10", pts: 10 },
                { name: "2001", p: 4, diff: "+6", pts: 10 },
                { name: "1991", p: 3, diff: "+12", pts: 9 },
                { name: "1998-v", p: 4, diff: "+6", pts: 6 },
                { name: "1992-23", p: 4, diff: "-7", pts: 4 },
                { name: "2000", p: 4, diff: "-14", pts: 1 },
                { name: "2008-23", p: 4, diff: "-13", pts: 0 }
            ],
            "D": [
                { name: "1997", p: 4, diff: "+22", pts: 12 },
                { name: "1994", p: 5, diff: "+11", pts: 10 },
                { name: "1995", p: 4, diff: "+9", pts: 7 },
                { name: "1998", p: 4, diff: "+3", pts: 7 },
                { name: "2007", p: 4, diff: "-2", pts: 4 },
                { name: "Obod-98", p: 4, diff: "-10", pts: 3 },
                { name: "1996", p: 5, diff: "-33", pts: 0 }
            ]
        };

        const scorersData = [
            { name: "Jahongir", team: "1997", goals: 17 },
            { name: "Sardor", team: "2001", goals: 14 },
            { name: "Islom", team: "1993", goals: 13 },
            { name: "Botir", team: "1998-v", goals: 12 },
            { name: "Xolyor", team: "2002-23", goals: 11 },
            { name: "Abdulaziz", team: "2007", goals: 11 },
            { name: "Botir", team: "2003", goals: 9 },
            { name: "Ravshan", team: "2005", goals: 8 },
            { name: "Lochin", team: "1998", goals: 8 },
            { name: "Farrux", team: "2002-23", goals: 8 }
        ];

        const matchesData = [
            {
                date: "9-Sentyabr (Chorshanba)",
                list: [
                    { t1: "1986", t2: "2005", time: "19:00" },
                    { t1: "2006", t2: "2003", time: "19:40" },
                    { t1: "1997", t2: "2007", time: "20:20" },
                    { t1: "1996-23", t2: "1991-23", time: "21:00" },
                    { t1: "1991", t2: "1998-v", time: "21:40" },
                    { t1: "2008-23", t2: "1992-23", time: "22:20" },
                    { t1: "1995", t2: "1998", time: "23:00" }
                ]
            },
            {
                date: "11-Sentyabr (Juma)",
                list: [
                    { t1: "1991", t2: "2001", time: "19:00" },
                    { t1: "2000", t2: "2008-23", time: "19:40" },
                    { t1: "Mahalla", t2: "2004", time: "20:20" },
                    { t1: "1991-23", t2: "2003-12", time: "21:00" },
                    { t1: "2005", t2: "2002", time: "21:40" },
                    { t1: "Obod", t2: "2007", time: "22:20" },
                    { t1: "1993", t2: "2003", time: "23:00" }
                ]
            }
        ];

        function switchMainTab(tab) {
            ['standings', 'scorers', 'matches'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('active');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        function renderGroup(grp) {
            ['A', 'B', 'C', 'D'].forEach(g => {
                const btn = document.getElementById(`btn-group-${g}`);
                if (g === grp) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const tbody = document.getElementById('standings-body');
            tbody.innerHTML = groupsData[grp].map((item, idx) => `
                <tr>
                    <td class="col-pos ${idx < 2 ? 'top-pos' : ''}">${idx + 1}</td>
                    <td class="col-team">${item.name}</td>
                    <td style="color: var(--text-muted);">${item.p}</td>
                    <td style="color: var(--text-muted); font-weight: 600;">${item.diff}</td>
                    <td class="col-pts">${item.pts}</td>
                </tr>
            `).join('');
        }

        function renderScorers() {
            const container = document.getElementById('scorers-body');
            container.innerHTML = scorersData.map((s, idx) => `
                <div class="scorer-item">
                    <div class="scorer-left">
                        <span class="scorer-rank ${idx < 3 ? 'rank-gold' : ''}">${idx + 1}</span>
                        <div>
                            <div class="scorer-name">${s.name}</div>
                            <div class="scorer-team">${s.team}</div>
                        </div>
                    </div>
                    <div class="scorer-goals">${s.goals} ⚽</div>
                </div>
            `).join('');
        }

        function renderMatches() {
            const container = document.getElementById('matches-body');
            container.innerHTML = matchesData.map(group => `
                <div>
                    <div class="date-title">📅 ${group.date}</div>
                    <div class="card">
                        ${group.list.map(m => `
                            <div class="match-row">
                                <span class="match-t">${m.t1}</span>
                                <span class="match-time">${m.time}</span>
                                <span class="match-t right">${m.t2}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        renderGroup('A');
        renderScorers();
        renderMatches();
    </script>
</body>
</html>
